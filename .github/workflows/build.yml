name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build & Package Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment and Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.STORE_PASSWORD || 'quran_release_key_2026' }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD || 'quran_release_key_2026' }}
        run: |
          # Create .env from template if not present
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Prepare release keystore:
          # If secret is provided, decode it. Otherwise generate a valid release keystore.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PWD" \
              -alias upload \
              -keypass "$KEY_PWD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Quran Karim,O=Quran,C=IR"
          fi

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'quran_release_key_2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'quran_release_key_2026' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-karim-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
