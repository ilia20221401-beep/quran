name: Verify APK Signature

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify APK
    runs-on: ubuntu-latest

    permissions:
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Download latest successful artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact

          echo "Finding latest successful run..."

          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "Add files via upload" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -z "$RUN_ID" ]; then
            echo "❌ No successful run found."
            exit 1
          fi

          echo "✅ Run ID: $RUN_ID"

          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            -n quran-karim-release-apk \
            -D artifact

      - name: Find APK
        id: apk
        run: |
          echo "Searching for APK..."

          APK=$(find artifact -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ No APK found."
            find artifact -type f
            exit 1
          fi

          echo "✅ APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          APK="${{ steps.apk.outputs.path }}"

          echo "======================================"
          echo "       APK SIGNATURE VERIFICATION"
          echo "======================================"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Show APK SHA-256
        run: |
          APK="${{ steps.apk.outputs.path }}"

          echo "======================================"
          echo "             SHA-256"
          echo "======================================"

          sha256sum "$APK"
