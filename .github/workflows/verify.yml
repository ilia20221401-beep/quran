name: Verify Release APK

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: quran-karim-release-apk
          path: artifact

      - name: Find APK
        id: find-apk
        run: |
          APK=$(find artifact -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK found!"
            find artifact -type f
            exit 1
          fi

          echo "Found: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "${{ steps.find-apk.outputs.apk }}"
