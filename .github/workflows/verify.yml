name: Verify Uploaded APK

on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify APK Signature
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'

      - name: Find APK
        id: apk
        shell: bash
        run: |
          echo "Searching for APK..."

          APK=$(find . -type f -iname "*.apk" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ No APK found in repository."
            exit 1
          fi

          echo "✅ APK found:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        run: |
          APK="${{ steps.apk.outputs.path }}"

          echo "======================================"
          echo "       APK SIGNATURE VERIFICATION"
          echo "======================================"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Calculate SHA-256
        run: |
          APK="${{ steps.apk.outputs.path }}"

          echo "======================================"
          echo "              SHA-256"
          echo "======================================"

          sha256sum "$APK"
